<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //3.5. Leia 2 notas de um aluno, 
        // calcule a média final e considere aprovação com nota 9,5. 
        // Em seguida, pergunte: `Calcular a média de outro aluno? (S/N)`. 
        // Se a resposta for `S`, repita; caso contrário, encerre e mostre a quantidade de alunos aprovados.

        var resposta = "S";
        var aprovados = 0;

        while (resposta == "S") {
            var nota1 = Number(prompt("Digite a primeira nota: "));
            var nota2 = Number(prompt("Digite a segunda nota: "));

            var soma = nota1 + nota2;
            var media = soma / 2;

            if (media >= 9.5) {
                alert("Você está aprovado!");
                aprovados++;
            }
            else {
                alert("Você está reprovado!");
            }
            resposta = prompt("Calcular a média de outro aluno? (S/N)");
        }
        alert("Quantidade de alunos aprovados: " + aprovados);



    </script>
</head>

</html>
