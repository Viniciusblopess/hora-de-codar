<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    //2.9. Leia o ano de nascimento e informe se a pessoa pode votar no ano atual (sem considerar o mês).

    var ano_nascimento = Number(prompt("Digite o ano de nascimento:"));
    var ano_atual = Number(prompt("Digite o ano atual:"));

    if(ano_atual - ano_nascimento >= 16){
        alert("Você pode votar! ");
    }
    else{
        alert("Você não pode votar! ");
    }
    </script>
</head>

</html>
