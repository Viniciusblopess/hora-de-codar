    <script>
        //3.2. Leia dois valores. Enquanto o segundo valor for menor ou igual a zero, peça novamente esse mesmo valor. Ao final, mostre a divisão do primeiro pelo segundo.

        var valor1 = Number(prompt("Digite o primeiro numero: "));
        var valor2 = Number(prompt("Digite o segundo numero: "));

        while(valor2 <= 0){
        valor2 = Number(prompt("Digite novamente o segundo numero: ")); 
        }
        var divisao = valor1/valor2;
        alert(divisao)
    </script>
