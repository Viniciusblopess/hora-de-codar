<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //2.8. Leia 4 números, aceitando apenas valores maiores que 0 e menores que 10. Calcule a média e:
        //se média > 5, exiba "Você passou no teste";
	    //caso contrário, exiba "Tente novamente".

        var numero1 = Number(prompt("Digite o primeiro numero maior que 0 e menor que 10: "));
        var numero2 = Number(prompt("Digite o segundo numero maior que 0 e menor que 10: "));
        var numero3 = Number(prompt("Digite o terceiro numero maior que 0 e menor que 10: "));
        var numero4 = Number(prompt("Digite o quarto numero maior que 0 e menor que 10: "));
        var media = (numero1 + numero2 + numero3 + numero4) / 4;

        if(numero1 > 0 && numero1 < 10 && numero2 > 0 && numero2 < 10 && numero3 > 0 && numero3 < 10 && numero4 > 0 && numero4 < 10){
            if(media > 5){
                alert("Você passou no teste");
            }else{
                alert("Tente novamente");
            }
        }else{
            alert("Por favor, digite apenas números maiores que 0 e menores que 10.");
        }
    </script>
</head>
