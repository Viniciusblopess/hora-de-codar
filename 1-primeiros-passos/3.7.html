<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //3.7. Leia um valor `N` (N > 0) e imprima todos os inteiros de 1 até `N`.

        var N = Number(prompt("Digite um número maior que 0: "));
        while (N <= 0) {
            N = Number(prompt("Valor inválido! Digite novamente: "));
        }
        for(var contador = 1; contador <= N; contador++){
            alert(contador);
        }
    </script>
</head>
