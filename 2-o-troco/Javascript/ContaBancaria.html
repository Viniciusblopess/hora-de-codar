<html>

<head>

	<script>
		//Ao acessar o sistema, pergunte o nome do usuário e diga "Olá {Nome} é um prazer ter você por aqui!"

		var nome = prompt("Qual é o seu nome? ");
		alert("Olá, " + nome + " é um prazer ter você por aqui!")

		// Aqui criamos uma variavel global. Global significa que o elemento pode ser acessado por qualquer método. Para tornar global, utilizamos a palavra static.

		var saldo = 100.5; // Float (Número com ponto flutuante)

		/*  Função principal. */
		/*- Na função "inicio", utilize escolha/caso (switch/case) ou when (quando), se possível, para validar a opção escolhida pelo usuário.*/

		function inicio() {

			var escolha = parseInt(prompt('Selecione uma opção 1.) Saldo 2.) Extrato 3.) Depósito 4.) Saque 5.) Sair'));

			switch (escolha) {
				case 1:
					ver_saldo();
					break;

				case 2:
					ver_extrato();
					break;

				case 3:
					fazer_deposito();
					break;

				case 4:
					fazer_saque();
					break;

				case 5:
					sair();
					break;

				default:
					erro();
					break;
			}
		}

		/*  Função principal. */
		function ver_saldo() {
			alert('Seu saldo atual é: ' + saldo);
			inicio();
		}

		//ver extrato

		function ver_extrato() {
			alert(
				"===== EXTRATO BANCÁRIO =====\n\n" +
				"Depósito recebido: +R$ 500,00\n" +
				"Mercado: -R$ 85,50\n" +
				"Netflix: -R$ 25,90\n" +
				"PIX recebido: +R$ 150,00\n" +
				"Lanche: -R$ 32,00\n\n" +
				"=========================="
			);
			inicio();
		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_deposito() {
			var deposito = parseFloat(prompt('Qual o valor para depósito?'));
			// Not a Number
			if (isNaN(deposito) || deposito === '') { // A Função isNaN checa se o valor informado é um Não-Número e retorna verdadeiro ou falso.
				alert('Por favor, informe um número:');
				fazer_deposito();
			} else {
				saldo += deposito;
				ver_saldo();
			}
		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		//- Sempre que o usuário for sacar dinheiro, o valor restante não pode ser negativo, ou seja, caso o usuário tente sacar mais do que tem em saldo, a ação não deve ocorrer. Exiba uma mensagem de "Operação não autorizada".
		function fazer_saque() {

			var saque = parseFloat(prompt('Qual o valor para saque?'));

			if (isNaN(saque)) {
				alert('Por favor, informe um número:');
				fazer_saque();
			}
			else {
				if (saque > saldo || saque <= 0) {
					alert("Operação não autorizada.");
				}
				else {
					saldo -= saque;
				}

				ver_saldo();
			}
		}
		//transferencia

		function fazer_transferencia() {

			var conta = prompt("Por favor informe o número da conta");

			if (isNaN(conta) || conta === '') {
				alert("Por favor, informe apenas números.");
				fazer_transferencia();
			}

			else {
				var trans = parseFloat(prompt("Qual o valor da transferência?"));
				if (isNaN(trans)) {
					alert("Por favor, informe um número.");
					fazer_transferencia();
				}

				else if (trans > saldo || trans <= 0) {
					alert("Operação não autorizada.");
				}
				else {
					saldo -= trans;
				}
			}
		}

		/* Verificar se há um erro */
		function erro() {
			alert("Por favor, informe um número entre 1 a 4");
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
				window.close();
			} else {
				inicio();
			}
		}



		inicio();
	</script>
</head>

<body>

</body>

</html>
