<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let estudantes = [];
        var nomes = prompt("Digite seu nome: ");
        while(nomes != 'pare'){
             estudantes.push(nomes);
             nomes = prompt("Digite seu nome: ");
        }

    alert("Quantidade de estudantes cadastrados: " + estudantes.length);

    alert("Estudantes cadastrados: " + estudantes.join(", "));

    </script>
</head>
