<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Terabithia | Cadastro de Hóspedes</title>
  <style>
    body {
      font: 16px Arial, sans-serif;
      max-width: 760px;
      margin: 3rem auto;
      padding: 0 1rem;
      color: #24313b
    }

    h1 {
      color: #245b67
    }

    #status {
      white-space: pre-wrap;
      background: #f1f5f6;
      padding: 1rem;
      border-radius: 5px;
      min-height: 3rem
    }
  </style>
</head>

<body>
  <h1>Cadastro de Hóspedes</h1>
  <p>Hotel Terabithia — sistema interno</p>
  <p>Use as caixas de diálogo para cadastrar e consultar hóspedes.</p>
  <div id="status" aria-live="polite">Cadastro encerrado.</div>
  <script>
    (() => {
      'use strict';
      const hospedes = [];
      const status = document.getElementById('status');
      const pedirNome = (mensagem) => {
        while (true) {
          const nome = prompt(mensagem);
          if (nome === null) return null;
          if (nome.trim()) return nome.trim();
          alert('Informe um nome válido.');
        }
      };
      const nomesOrdenados = () => [...hospedes].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      const listarTexto = (lista) => lista.map((h, i) => `[${i + 1}] ${h.nome} — cadastrado em ${h.criado.toLocaleString('pt-BR')}`).join('\n');
      const pedirIndice = (lista) => {
        while (true) {
          const entrada = prompt(`Informe o índice do hóspede:\n${listarTexto(lista)}`);
          if (entrada === null) return null;
          const indice = Number(entrada);
          if (Number.isInteger(indice) && indice >= 1 && indice <= lista.length) return indice - 1;
          alert('Índice inválido.');
        }
      };
      function cadastrar() {
        if (hospedes.length >= 15) { alert('Máximo de cadastros atingido'); return; }
        const nome = pedirNome('Nome do hóspede:');
        if (nome === null) return;
        if (hospedes.some(h => h.nome.toLocaleLowerCase('pt-BR') === nome.toLocaleLowerCase('pt-BR'))) {
          alert('Hóspede já cadastrado'); return;
        }
        hospedes.push({ nome, criado: new Date() });
        alert('Operação realizada com sucesso');
      }
      function pesquisarExato() {
        const nome = pedirNome('Nome exato para pesquisar:');
        if (nome === null) return;
        const encontrado = hospedes.find(h => h.nome.toLocaleLowerCase('pt-BR') === nome.toLocaleLowerCase('pt-BR'));
        alert(encontrado ? `Hóspede ${encontrado.nome} foi encontrado` : 'Hóspede não encontrado');
      }
      function pesquisarPrefixo() {
        const prefixo = prompt('Prefixo para pesquisar:');
        if (prefixo === null) return;
        const encontrados = hospedes.filter(h => h.nome.toLocaleLowerCase('pt-BR').startsWith(prefixo.trim().toLocaleLowerCase('pt-BR')));
        alert(encontrados.length ? `Resultados:\n${encontrados.map(h => h.nome).join('\n')}` : 'Hóspede não encontrado');
      }
      function listar() {
        const lista = nomesOrdenados();
        alert(lista.length ? listarTexto(lista) : 'Nenhum hóspede cadastrado.');
      }
      function atualizar() {
        const lista = nomesOrdenados();
        if (!lista.length) { alert('Nenhum hóspede cadastrado.'); return; }
        const indice = pedirIndice(lista);
        if (indice === null) return;
        const alvo = lista[indice];
        const nome = pedirNome('Informe o novo nome:');
        if (nome === null) return;
        if (hospedes.some(h => h !== alvo && h.nome.toLocaleLowerCase('pt-BR') === nome.toLocaleLowerCase('pt-BR'))) {
          alert('Hóspede já cadastrado'); return;
        }
        alvo.nome = nome;
        alert('Operação realizada com sucesso');
      }
      function remover() {
        const lista = nomesOrdenados();
        if (!lista.length) { alert('Nenhum hóspede cadastrado.'); return; }
        const indice = pedirIndice(lista);
        if (indice === null) return;
        hospedes.splice(hospedes.indexOf(lista[indice]), 1);
        alert('Operação realizada com sucesso');
      }
      function iniciar() {
        while (true) {
          const opcao = prompt('[Cadastro de Hóspedes]\n1 - Cadastrar\n2 - Pesquisar por nome exato\n3 - Pesquisar por prefixo\n4 - Listar ordenado (A-Z)\n5 - Atualizar cadastro\n6 - Remover cadastro\n7 - Voltar / Sair');
          if (opcao === null || opcao.trim() === '7') {
            status.textContent = `Cadastro encerrado. Hóspedes ativos nesta sessão: ${hospedes.length}.`;
            return;
          }
          switch (opcao.trim()) {
            case '1': cadastrar(); break;
            case '2': pesquisarExato(); break;
            case '3': pesquisarPrefixo(); break;
            case '4': listar(); break;
            case '5': atualizar(); break;
            case '6': remover(); break;
            default: alert('Opção inválida. Informe um número entre 1 e 7.');
          }
        }
      }
      iniciar();
    })();
  </script>
</body>

</html>
